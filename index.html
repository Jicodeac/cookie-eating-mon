<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cookie Chomp">
<title>Cookie Chomp</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#faf2e0;font-family:-apple-system,system-ui,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:#333}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 12px);text-align:center;pointer-events:none}
  #time{font:900 36px ui-monospace,Menlo,monospace}
  #status{font-weight:600;color:#777;margin:4px 0 8px}
  button{pointer-events:auto;font:600 15px -apple-system,system-ui;border:0;border-radius:10px;padding:8px 12px;margin:3px;
    background:#e8dcc4;color:#333}
  button.sel{background:#d97857;color:#fff}
  #msg{position:fixed;left:0;right:0;top:45%;text-align:center;font-weight:800;font-size:22px;white-space:pre-line;
    pointer-events:none;text-shadow:0 0 6px #faf2e0,0 0 6px #faf2e0}
  #menu{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);text-align:center;
    background:rgba(250,242,224,.92);border-radius:16px;padding:10px}
  #recs{font:600 16px ui-monospace,Menlo,monospace;white-space:pre-line;margin:8px 0}
  #go{background:#d97857;color:#fff;font-size:20px;padding:10px 40px}
  #histList{font:14px ui-monospace,Menlo,monospace;white-space:pre-line;max-height:28vh;overflow-y:auto;
    touch-action:pan-y;margin:6px 0;text-align:left;padding:0 8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="time">0.00 s</div>
  <div id="status"></div>
  <button id="mode"></button><button id="place"></button><button id="quit">Menu</button>
</div>
<div id="msg"></div>
<div id="menu">
  <div id="shapes"></div>
  <div id="recs"></div>
  <div id="histList"></div>
  <button id="go">Start</button><button id="hist"></button>
</div>
<script>
// Fully offline: no network requests. Records and settings are stored on this device only.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// Cookie shapes: unit-space tests (x, y in -1..1, y points down)
const SHAPES = [
  ["Circle",   (x, y) => x * x + y * y <= 1],
  ["Square",   (x, y) => Math.abs(x) <= 0.85 && Math.abs(y) <= 0.85],
  ["Triangle", (x, y) => y >= -0.9 && y <= 0.85 && Math.abs(x) <= (y + 0.9) * 0.55],
  ["Star",     (x, y) => Math.hypot(x, y) <= 0.4 + 0.55 * Math.cos(2.5 * (Math.atan2(y, x) + Math.PI / 2)) ** 2],
  ["Heart",    (x, y) => { const X = x * 1.25, Y = -y * 1.25 + 0.25; return (X * X + Y * Y - 1) ** 3 - X * X * Y ** 3 <= 0; }]
];

const cv = document.getElementById("c"), g = cv.getContext("2d");
const $ = id => document.getElementById(id);
let W = 0, H = 0;
function resize() {
  const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
  if (state !== "playing") load();
}

let state = "menu", shape = store.get("shape", 0), crumbs = [], cell = 5, pos = { x: 0, y: 0 };
let target = null, joy = { x: 0, y: 0 }, last = 0, lastBite = -1e9, elapsed = 0, result = "";
let records = store.get("records", {}), history = store.get("history", {}), showHist = false;
let useJoy = store.get("useJoy", false), jp = store.get("jp", null), placing = false;
const joyPoint = () => jp || { x: 100, y: H - 140 };
const pointers = new Set();

function load() {
  const n = 24, R = Math.min(W, H) * 0.42, cx = W / 2, cy = H * 0.45, inside = SHAPES[shape][1];
  cell = R / n; crumbs = [];
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++)
    if (inside(i / n, j / n)) crumbs.push({ x: cx + i * cell, y: cy + j * cell, chip: Math.random() < 0.12 });
  pos = { x: W / 2, y: H - 80 };
}

function start() { load(); state = "playing"; elapsed = 0; result = ""; pointers.clear(); release(); }

function finish() {
  const name = SHAPES[shape][0], list = (records[name] || []).concat(elapsed).sort((a, b) => a - b).slice(0, 3);
  records[name] = list; store.set("records", records);
  history[name] = [{ t: elapsed, d: Date.now() }].concat(history[name] || []).slice(0, 200);
  store.set("history", history);
  const rank = list.indexOf(elapsed);
  result = `Done in ${elapsed.toFixed(2)} s!` + (rank >= 0 ? `\n🏆 New #${rank + 1} record!` : "");
  state = "menu"; load();
}

function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (state !== "playing" || !pointers.size) return; // paused while no finger is down
  elapsed += dt;
  const speed = 340;
  let mx = joy.x * speed * dt, my = joy.y * speed * dt;
  if (target) {
    const dx = target.x - pos.x, dy = target.y - pos.y, l = Math.max(Math.hypot(dx, dy), 0.001);
    const s = Math.min(speed * dt, l) / l; mx = dx * s; my = dy * s;
  }
  pos.x = Math.min(Math.max(pos.x + mx, 18), W - 18);
  pos.y = Math.min(Math.max(pos.y + my, 18), H - 18);
  const before = crumbs.length;
  crumbs = crumbs.filter(c => Math.hypot(c.x - pos.x, c.y - pos.y) >= 13);
  if (crumbs.length < before) lastBite = now;
  if (!crumbs.length) finish();
}

// Round pixel critter: 13x13 grid, 3px pixels, no legs
const BODY = [];
for (let y = 0; y < 13; y++) for (let x = 0; x < 13; x++) if ((x - 6) ** 2 + (y - 6) ** 2 <= 6.5 ** 2) BODY.push([x, y]);
function drawCharacter(now) {
  const p = 3, ox = pos.x - 19.5, oy = pos.y - 19.5;
  const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(ox + x * p, oy + y * p, w * p, h * p); };
  for (const [x, y] of BODY) px(x, y, 1, 1, "#e8a33c");
  px(3, 2, 2, 1, "#f6cf7a");                           // shine
  px(4, 4, 1, 2, "#000"); px(8, 4, 1, 2, "#000");      // eyes
  const open = now - lastBite < 250 && Math.floor(now / 70) % 2 === 0 ? 4 : 1;
  px(3, 7, 7, open, "#3a0d0d");                        // big mouth
}

function draw(now) {
  g.clearRect(0, 0, W, H);
  for (const c of crumbs) {
    g.fillStyle = c.chip ? "#59331a" : "#cc8f4d";
    g.fillRect(c.x - cell / 2, c.y - cell / 2, cell + 0.5, cell + 0.5);
  }
  if (state === "playing") drawCharacter(now);
  if (useJoy) {
    const p = joyPoint();
    g.strokeStyle = g.fillStyle = "rgba(128,128,128,.5)"; g.lineWidth = 3;
    g.beginPath(); g.arc(p.x, p.y, 60, 0, 7); g.stroke();
    g.beginPath(); g.arc(p.x + joy.x * 60, p.y + joy.y * 60, 25, 0, 7); g.fill();
  }
}

function renderMenu() {
  $("shapes").innerHTML = "";
  SHAPES.forEach(([name], i) => {
    const b = document.createElement("button");
    b.textContent = name; b.className = i === shape ? "sel" : "";
    b.onclick = () => { shape = i; store.set("shape", i); load(); renderMenu(); };
    $("shapes").appendChild(b);
  });
  const list = records[SHAPES[shape][0]] || [];
  $("recs").textContent = `Top 3 · ${SHAPES[shape][0]}\n` +
    [0, 1, 2].map(i => `${i + 1}. ${list[i] != null ? list[i].toFixed(2) + " s" : "—"}`).join("\n");
  const runs = history[SHAPES[shape][0]] || [];
  $("hist").textContent = showHist ? "Hide history" : `History (${runs.length})`;
  $("histList").style.display = showHist ? "" : "none";
  $("histList").textContent = runs.length ? runs.map((r, i) => {
    const d = new Date(r.d).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    return `${String(runs.length - i).padStart(3)}. ${r.t.toFixed(2).padStart(7)} s   ${d}`;
  }).join("\n") : "No games yet";
}

function updateHud() {
  const playing = state === "playing";
  $("time").textContent = elapsed.toFixed(2) + " s";
  $("status").textContent = playing ? SHAPES[shape][0] + " cookie" : "Cookie Chomp";
  $("mode").textContent = useJoy ? "🕹 Joystick" : "☝️ Touch";
  $("place").style.display = useJoy ? "" : "none";
  $("place").textContent = placing ? "Tap a spot…" : "Move joystick";
  $("quit").style.display = playing ? "" : "none";
  $("menu").style.display = playing ? "none" : "";
  $("msg").textContent = playing ? (pointers.size ? "" : "Paused\nTouch to keep going") : result;
}

function loop(now) { tick(now); draw(now); updateHud(); requestAnimationFrame(loop); }

$("mode").onclick = () => { useJoy = !useJoy; placing = false; store.set("useJoy", useJoy); };
$("place").onclick = () => { placing = !placing; };
$("quit").onclick = () => { state = "menu"; elapsed = 0; load(); renderMenu(); };
$("go").onclick = () => start();
$("hist").onclick = () => { showHist = !showHist; renderMenu(); };

let startPt = null;
function steer(p) {
  if (useJoy) {
    const c = joyPoint();
    if (Math.hypot(startPt.x - c.x, startPt.y - c.y) >= 90) return;
    let dx = (p.x - c.x) / 60, dy = (p.y - c.y) / 60; const l = Math.hypot(dx, dy);
    if (l > 1) { dx /= l; dy /= l; }
    joy = { x: dx, y: dy };
  } else target = p;
}
function release() { joy = { x: 0, y: 0 }; target = null; }
cv.addEventListener("pointerdown", e => {
  const p = { x: e.clientX, y: e.clientY };
  if (placing) { jp = p; store.set("jp", jp); placing = false; return; }
  if (state !== "playing") return;
  pointers.add(e.pointerId); startPt = p; steer(p);
});
cv.addEventListener("pointermove", e => { if (pointers.has(e.pointerId)) steer({ x: e.clientX, y: e.clientY }); });
const up = e => { pointers.delete(e.pointerId); if (!pointers.size) release(); };
cv.addEventListener("pointerup", up);
cv.addEventListener("pointercancel", up);
document.addEventListener("touchmove", e => { if (!e.target.closest("#histList")) e.preventDefault(); }, { passive: false });

addEventListener("resize", resize); resize(); renderMenu();
requestAnimationFrame(t => { last = t; loop(t); });
</script>
</body>
</html>
